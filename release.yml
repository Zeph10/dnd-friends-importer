# Builds the Foundry package whenever a release is published.
# Tag the release with the module version, e.g. v0.18.2 (must match "version" in module.json).
name: Release module

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download links into module.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="https://github.com/${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "$REPO" \
             --arg manifest "$REPO/releases/latest/download/module.json" \
             --arg download "$REPO/releases/download/$TAG/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json
          cat module.json

      - name: Build module.zip
        run: zip -r module.zip module.json README.md scripts styles

      - name: Attach module.json and module.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
